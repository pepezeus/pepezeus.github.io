<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PepeZeus - The God of Memes</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* CSS Variabelen ingesteld op jouw stijl */
    :root {
      --bg-color: #0b0e14;          /* Donkere crypto-achtergrond */
      --card-bg: #161b26;           /* Iets lichtere vlakken */
      --primary-color: #ffd700;      /* Zeus Goud */
      --secondary-color: #00e5ff;    /* Bliksem Blauw */
      --text-color: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-align: center;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo {
      font-weight: 900;
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    .hero {
      padding: 80px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero img {
      width: 250px;
      height: auto;
      filter: drop-shadow(0 0 20px var(--primary-color));
    }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 20px;
    }

    h1 span {
      color: var(--primary-color);
    }

    p {
      color: #a0aec0;
      font-size: 1.1rem;
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 30px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #000;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
    }

    .btn-secondary {
      border: 2px solid var(--secondary-color);
      color: var(--secondary-color);
    }

    .btn-secondary:hover {
      background: var(--secondary-color);
      color: #000;
    }

    .section {
      padding: 60px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #2d3748;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ PEPEZEUS</div>
    <a href="#buy" class="btn btn-primary" style="padding: 10px 20px;">Koop $PEPEZEUS</a>
  </header>

  <section class="hero">
    <!-- Vervang pepezeus.png door jouw eigen afbeelding in GitHub -->
    <img src="pepezeus.png" alt="PepeZeus">
    <h1>Heers over de Crypto Olympus met <span>$PEPEZEUS</span></h1>
    <p>De ultieme memecoin die de kracht van Zeus combineert met de magie van Pepe.</p>
    <div>
      <a href="https://t.me/jouwtelegram" class="btn btn-primary" target="_blank">Join Telegram</a>
      <a href="#chart" class="btn btn-secondary">Bekijk Grafiek</a>
    </div>
  </section>

  <section class="section">
    <h2>Tokenomics</h2>
    <div class="grid">
      <div class="card">
        <h3 style="color: var(--primary-color);">1,000,000,000</h3>
        <p>Totale Voorraad</p>
      </div>
      <div class="card">
        <h3 style="color: var(--secondary-color);">0% / 0%</h3>
        <p>Buy / Sell Tax</p>
      </div>
      <div class="card">
        <h3 style="color: var(--primary-color);">100% LP</h3>
        <p>Liquidity Verbrand</p>
      </div>
    </div>
  </section>

</body>
</html>
